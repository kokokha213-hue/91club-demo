<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3 LEVEL SCRIPT · ANSH BHAI</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Inter', 'Segoe UI', Roboto, system-ui, sans-serif;
      user-select: none;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 16px 10px;
      position: relative;
      background: #0b0b0f;
      overflow-x: hidden;
    }

    /* ---- VIDEO BACKGROUND ---- */
    #bg-video {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: 0;
      pointer-events: none;
      opacity: 0.55;
      filter: brightness(1.1) saturate(1.3) contrast(1.1);
    }

    /* ---- FIRE CANVAS (real fire animation) ---- */
    #fire-canvas {
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 30vh;
      z-index: 1;
      pointer-events: none;
      opacity: 0.85;
      filter: blur(1px) brightness(1.4);
    }

    /* ---- DARK OVERLAY for readability ---- */
    .overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: radial-gradient(circle at 30% 40%, rgba(0, 0, 0, 0.55) 0%, rgba(0, 0, 0, 0.85) 90%);
      z-index: 2;
      pointer-events: none;
    }

    /* ---- MAIN GLASS APP ---- */
    .app {
      position: relative;
      z-index: 10;
      width: 100%;
      max-width: 430px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
      padding: 6px 0 30px 0;
      animation: floatIn 0.8s cubic-bezier(0.2, 0.9, 0.3, 1.1);
    }

    @keyframes floatIn {
      0% { opacity: 0; transform: translateY(30px) scale(0.96); }
      100% { opacity: 1; transform: translateY(0) scale(1); }
    }

    /* ---- LOGIN MODAL (glass) ---- */
    .login-modal {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 999;
      display: flex;
      justify-content: center;
      align-items: center;
      background: rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      transition: opacity 0.4s ease;
      padding: 20px;
    }

    .login-modal.hidden {
      opacity: 0;
      pointer-events: none;
    }

    .login-card {
      width: 100%;
      max-width: 360px;
      background: rgba(20, 20, 30, 0.55);
      backdrop-filter: blur(18px) saturate(180%);
      -webkit-backdrop-filter: blur(18px) saturate(180%);
      border-radius: 42px;
      padding: 38px 24px 32px 24px;
      border: 1.5px solid rgba(255, 215, 100, 0.35);
      box-shadow: 0 30px 50px rgba(0, 0, 0, 0.7), 0 0 0 1px rgba(255, 200, 50, 0.1) inset, 0 0 40px rgba(255, 170, 0, 0.2);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 18px;
      animation: cardPop 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    @keyframes cardPop {
      0% { transform: scale(0.85); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }

    .login-card h1 {
      font-size: 26px;
      font-weight: 900;
      color: #fde68a;
      text-shadow: 0 0 20px #f59e0b, 0 4px 10px rgba(0, 0, 0, 0.6);
      letter-spacing: 1.5px;
      text-align: center;
      line-height: 1.2;
    }

    .login-card .dev {
      font-size: 13px;
      color: #fcd34d;
      letter-spacing: 3px;
      font-weight: 600;
      opacity: 0.9;
      margin-top: -6px;
      text-shadow: 0 2px 8px rgba(0, 0, 0, 0.5);
    }

    .login-card input {
      width: 100%;
      padding: 16px 18px;
      border-radius: 36px;
      border: 1.5px solid rgba(255, 200, 70, 0.35);
      background: rgba(10, 10, 15, 0.6);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      color: #fff7e6;
      font-size: 18px;
      font-weight: 600;
      letter-spacing: 1.5px;
      text-align: center;
      outline: none;
      transition: all 0.3s;
      box-shadow: 0 0 0 0 rgba(255, 200, 50, 0);
    }

    .login-card input::placeholder {
      color: #a78b4b;
      font-weight: 400;
      letter-spacing: 1px;
    }

    .login-card input:focus {
      border-color: #fbbf24;
      box-shadow: 0 0 28px rgba(251, 191, 36, 0.4), 0 0 0 4px rgba(251, 191, 36, 0.1);
      background: rgba(20, 20, 28, 0.8);
    }

    .login-card button {
      width: 100%;
      padding: 16px;
      border-radius: 40px;
      border: none;
      background: linear-gradient(145deg, #eab308, #b45309);
      color: #1a1206;
      font-size: 19px;
      font-weight: 900;
      letter-spacing: 2px;
      cursor: pointer;
      transition: all 0.3s;
      box-shadow: 0 12px 28px rgba(234, 179, 8, 0.35), 0 0 0 1px rgba(255, 215, 0, 0.5) inset;
      text-transform: uppercase;
      margin-top: 6px;
    }

    .login-card button:hover {
      background: linear-gradient(145deg, #facc15, #d97706);
      transform: scale(1.02);
      box-shadow: 0 18px 32px rgba(250, 204, 21, 0.5), 0 0 0 2px rgba(255, 215, 0, 0.7) inset;
    }

    .login-card button:active {
      transform: scale(0.97);
    }

    /* ---- GLASS COMPONENTS ---- */
    .glass {
      background: rgba(20, 20, 30, 0.45);
      backdrop-filter: blur(16px) saturate(180%);
      -webkit-backdrop-filter: blur(16px) saturate(180%);
      border: 1.5px solid rgba(255, 215, 100, 0.25);
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.6), 0 0 0 1px rgba(255, 200, 50, 0.1) inset;
      border-radius: 32px;
      transition: all 0.3s ease;
    }

    .title {
      font-size: 28px;
      font-weight: 900;
      text-align: center;
      color: #fde68a;
      text-shadow: 0 0 30px #f59e0b, 0 0 60px #b45309, 0 4px 10px black;
      letter-spacing: 1.5px;
      line-height: 1.2;
      margin-top: 4px;
    }

    .sub {
      font-size: 12px;
      color: #fcd34d;
      letter-spacing: 4px;
      font-weight: 700;
      margin-top: -8px;
      opacity: 0.9;
      text-shadow: 0 2px 12px black;
    }

    .dev-tag {
      font-size: 11px;
      color: #fbbf24;
      letter-spacing: 2px;
      font-weight: 700;
      background: rgba(0, 0, 0, 0.4);
      padding: 5px 18px;
      border-radius: 40px;
      backdrop-filter: blur(4px);
      border: 1px solid rgba(255, 215, 0, 0.3);
      margin-top: -4px;
    }

    /* Stats Grid */
    .stats-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      width: 100%;
      margin-top: 4px;
    }

    .stat-box {
      background: rgba(15, 15, 22, 0.6);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 215, 100, 0.25);
      border-radius: 24px;
      padding: 12px 8px;
      text-align: center;
      box-shadow: 0 10px 20px rgba(0, 0, 0, 0.5), 0 0 0 1px rgba(255, 200, 50, 0.1) inset;
      transition: all 0.2s;
    }

    .stat-lbl {
      font-size: 10px;
      font-weight: 800;
      color: #d4a373;
      letter-spacing: 1px;
      text-transform: uppercase;
      text-shadow: 0 2px 8px black;
    }

    .stat-val {
      font-size: 22px;
      font-weight: 900;
      color: #fde68a;
      margin-top: 4px;
      text-shadow: 0 0 15px #f59e0b, 0 4px 8px black;
    }

    .acc-bar-wrap {
      width: 100%;
      background: rgba(0, 0, 0, 0.5);
      border-radius: 40px;
      height: 7px;
      overflow: hidden;
      border: 1px solid rgba(255, 200, 50, 0.3);
      margin-top: 6px;
    }

    .acc-bar-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #f59e0b, #fbbf24, #fde047);
      border-radius: 40px;
      box-shadow: 0 0 18px #fbbf24;
      transition: width 0.5s cubic-bezier(0.2, 0.9, 0.3, 1);
    }

    /* Tabs */
    .tabs {
      display: flex;
      width: 100%;
      background: rgba(10, 10, 16, 0.55);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border-radius: 40px;
      overflow: hidden;
      border: 1px solid rgba(255, 215, 100, 0.3);
      box-shadow: 0 12px 28px rgba(0, 0, 0, 0.6);
      margin-top: 4px;
    }

    .tbtn {
      flex: 1;
      padding: 13px 4px;
      border: none;
      background: transparent;
      color: #d4a373;
      font-size: 12px;
      font-weight: 800;
      cursor: pointer;
      transition: all 0.3s;
      letter-spacing: 0.5px;
      text-shadow: 0 2px 8px black;
      border-right: 1px solid rgba(255, 200, 50, 0.1);
    }

    .tbtn:last-child {
      border-right: none;
    }

    .tbtn.active {
      background: linear-gradient(145deg, #eab308, #b45309);
      color: #0b0b0f;
      text-shadow: 0 1px 4px rgba(255, 255, 255, 0.4);
      box-shadow: 0 0 25px #eab308, inset 0 2px 8px rgba(255, 255, 255, 0.4);
      font-weight: 900;
    }

    /* Main Card */
    .card {
      width: 100%;
      background: rgba(18, 18, 26, 0.55);
      backdrop-filter: blur(18px) saturate(180%);
      -webkit-backdrop-filter: blur(18px) saturate(180%);
      border: 1.5px solid rgba(255, 215, 100, 0.3);
      border-radius: 38px;
      padding: 24px 18px;
      display: flex;
      flex-direction: column;
      align-items: center;
      box-shadow: 0 30px 50px rgba(0, 0, 0, 0.7), 0 0 0 1px rgba(255, 200, 50, 0.1) inset, 0 0 40px rgba(255, 170, 0, 0.15);
      transition: all 0.3s;
      min-height: 300px;
    }

    .prd {
      font-size: 13px;
      color: #fcd34d;
      font-weight: 800;
      margin-bottom: 10px;
      background: rgba(0, 0, 0, 0.5);
      padding: 6px 20px;
      border-radius: 40px;
      border: 1px solid rgba(255, 215, 0, 0.3);
      letter-spacing: 1px;
      backdrop-filter: blur(4px);
      text-shadow: 0 2px 6px black;
    }

    .mpred {
      font-size: 68px;
      font-weight: 900;
      color: #fde68a;
      margin: 4px 0 12px 0;
      letter-spacing: 4px;
      text-shadow: 0 0 30px #f59e0b, 0 0 70px #b45309, 0 8px 20px black;
      line-height: 1;
    }

    .mpred.small {
      color: #f87171;
      text-shadow: 0 0 30px #ef4444, 0 0 70px #b91c1c, 0 8px 20px black;
    }

    .obox {
      width: 100%;
      border: 2px dashed rgba(255, 200, 50, 0.5);
      background: rgba(20, 20, 30, 0.5);
      backdrop-filter: blur(10px);
      padding: 14px;
      text-align: center;
      border-radius: 28px;
      box-shadow: 0 0 30px rgba(234, 179, 8, 0.15), inset 0 0 30px rgba(234, 179, 8, 0.05);
    }

    .olbl {
      font-size: 11px;
      color: #d4a373;
      font-weight: 800;
      letter-spacing: 2px;
      text-transform: uppercase;
      text-shadow: 0 2px 8px black;
    }

    .oval {
      font-size: 34px;
      font-weight: 900;
      color: #fbbf24;
      letter-spacing: 4px;
      text-shadow: 0 0 20px #f59e0b, 0 0 50px #b45309;
    }

    /* Views */
    .panel {
      display: none;
      width: 100%;
    }

    .panel.active {
      display: block;
    }

    /* Summary list */
    .shead {
      font-size: 13px;
      font-weight: 800;
      text-align: center;
      color: #fcd34d;
      margin-bottom: 14px;
      letter-spacing: 1px;
      text-shadow: 0 2px 10px black;
      background: rgba(0, 0, 0, 0.3);
      padding: 8px;
      border-radius: 40px;
    }

    .slist {
      display: flex;
      flex-direction: column;
      gap: 8px;
      max-height: 280px;
      overflow-y: auto;
      padding-right: 4px;
      scrollbar-width: thin;
      scrollbar-color: #b45309 #1a1a24;
    }

    .slist::-webkit-scrollbar {
      width: 4px;
    }

    .slist::-webkit-scrollbar-track {
      background: rgba(0, 0, 0, 0.3);
      border-radius: 10px;
    }

    .slist::-webkit-scrollbar-thumb {
      background: #b45309;
      border-radius: 10px;
      box-shadow: 0 0 10px #f59e0b;
    }

    .scard {
      background: rgba(15, 15, 22, 0.7);
      backdrop-filter: blur(8px);
      border-radius: 20px;
      padding: 10px 14px;
      border: 1px solid rgba(255, 200, 50, 0.2);
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 6px 14px rgba(0, 0, 0, 0.4);
    }

    /* Badges */
    .bwin {
      background: rgba(22, 163, 74, 0.25);
      backdrop-filter: blur(4px);
      color: #4ade80;
      padding: 5px 12px;
      border-radius: 40px;
      font-size: 10px;
      font-weight: 900;
      border: 1px solid #4ade80;
      box-shadow: 0 0 18px #22c55e;
      text-shadow: 0 0 8px #22c55e;
    }

    .bjack {
      background: rgba(245, 158, 11, 0.25);
      backdrop-filter: blur(4px);
      color: #fcd34d;
      padding: 5px 12px;
      border-radius: 40px;
      font-size: 10px;
      font-weight: 900;
      border: 1px solid #fbbf24;
      box-shadow: 0 0 22px #f59e0b;
      animation: jackPulse 0.8s infinite alternate;
    }

    @keyframes jackPulse {
      0% { transform: scale(1); box-shadow: 0 0 12px #f59e0b; }
      100% { transform: scale(1.05); box-shadow: 0 0 32px #fde047; }
    }

    .bloss {
      background: rgba(220, 38, 38, 0.2);
      backdrop-filter: blur(4px);
      color: #f87171;
      padding: 5px 12px;
      border-radius: 40px;
      font-size: 10px;
      font-weight: 900;
      border: 1px solid #ef4444;
      box-shadow: 0 0 15px #dc2626;
    }

    /* History Table */
    .htable {
      width: 100%;
      border-collapse: collapse;
      text-align: center;
      font-size: 12px;
    }

    .htable th {
      color: #d4a373;
      padding-bottom: 10px;
      border-bottom: 1.5px solid rgba(255, 200, 50, 0.3);
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 1px;
      text-shadow: 0 2px 8px black;
    }

    .htable td {
      padding: 9px 0;
      font-weight: 700;
      color: #e5e5e5;
      border-bottom: 1px solid rgba(255, 200, 50, 0.1);
      text-shadow: 0 2px 8px black;
    }

    .swin { color: #4ade80; font-weight: 900; text-shadow: 0 0 12px #22c55e; }
    .sjack { color: #fcd34d; font-weight: 900; text-shadow: 0 0 16px #f59e0b; }
    .sloss { color: #f87171; font-weight: 900; text-shadow: 0 0 12px #ef4444; }

    /* Big Footer Button */
    .bbtn {
      border: 1.5px solid rgba(255, 215, 100, 0.6);
      background: rgba(20, 20, 30, 0.5);
      backdrop-filter: blur(12px);
      color: #fde68a;
      padding: 14px 36px;
      border-radius: 40px;
      font-size: 14px;
      font-weight: 900;
      letter-spacing: 2px;
      cursor: default;
      box-shadow: 0 15px 30px rgba(0, 0, 0, 0.6), 0 0 0 1px rgba(255, 200, 50, 0.2) inset, 0 0 40px rgba(255, 170, 0, 0.2);
      text-shadow: 0 0 20px #f59e0b, 0 2px 8px black;
      transition: all 0.3s;
      margin-top: 8px;
    }

    .bbtn:hover {
      box-shadow: 0 0 50px #f59e0b, 0 15px 30px rgba(0, 0, 0, 0.8);
      border-color: #fbbf24;
    }

    /* Popup Modal */
    .modal {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.75);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 1000;
    }

    .modal.active {
      display: flex;
    }

    .mbox {
      padding: 28px 40px;
      border-radius: 36px;
      text-align: center;
      color: #fff;
      transform: scale(0.4);
      opacity: 0;
      transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      background: rgba(20, 20, 30, 0.7);
      backdrop-filter: blur(24px);
      border: 2px solid #fbbf24;
      box-shadow: 0 0 70px #f59e0b, 0 30px 50px black;
    }

    .modal.active .mbox {
      transform: scale(1);
      opacity: 1;
    }

    .mwin {
      background: linear-gradient(145deg, rgba(22, 163, 74, 0.8), rgba(21, 128, 61, 0.9));
      border-color: #86efac;
      box-shadow: 0 0 70px #22c55e, 0 30px 50px black;
    }

    .mjack {
      background: linear-gradient(145deg, rgba(180, 83, 9, 0.9), rgba(245, 158, 11, 0.8));
      border-color: #fde047;
      animation: jackGlow 0.8s infinite alternate;
    }

    @keyframes jackGlow {
      0% { box-shadow: 0 0 40px #f59e0b; }
      100% { box-shadow: 0 0 90px #fde047; }
    }

    .mtitle {
      font-size: 32px;
      font-weight: 900;
      margin-bottom: 6px;
      text-shadow: 0 0 30px black, 0 4px 10px black;
    }

    .msub {
      font-size: 15px;
      font-weight: 800;
      letter-spacing: 1px;
      text-shadow: 0 2px 10px black;
    }

    /* Utility */
    .hidden { display: none !important; }

  /* ===== WHITE + PINK NEOMORPHISM REDESIGN ===== */
  :root {
    --page: #f7f5fa;
    --surface: #f7f5fa;
    --pink: #ff4fa3;
    --pink-deep: #e82e86;
    --pink-soft: #ffd5e8;
    --ink: #433443;
    --muted: #9a8797;
    --shadow-light: #ffffff;
    --shadow-dark: #d9d3df;
  }
  html { background: var(--page); }
  body {
    background: radial-gradient(ellipse at 50% 0%, #fff 0%, #f9edf4 48%, #f1edf6 100%);
    color: var(--ink);
    overflow-x: hidden;
  }
  #bg-video, #fire-canvas, .overlay { display:none !important; }
  #matrix-canvas {
    position:fixed; inset:0; width:100%; height:100%;
    z-index:1; pointer-events:none; opacity:.22;
  }
  .app { z-index:5; gap:14px; padding-top:12px; }
  .login-modal {
    background:rgba(247,245,250,.72);
    backdrop-filter:blur(18px); -webkit-backdrop-filter:blur(18px);
  }
  .login-card, .glass, .stat-box, .tabs, .card, .obox, .scard, .mbox {
    background:var(--surface);
    color:var(--ink);
    border:1px solid rgba(255,79,163,.16);
    box-shadow: 9px 9px 22px var(--shadow-dark), -9px -9px 22px var(--shadow-light);
    backdrop-filter:none; -webkit-backdrop-filter:none;
  }
  .login-card { border-radius:30px; padding:34px 24px; gap:18px; }
  .login-card h1, .title {
    color:var(--pink-deep); text-shadow:0 3px 0 #fff, 0 8px 22px rgba(232,46,134,.18);
    letter-spacing:1.2px;
  }
  .login-card .dev, .sub, .dev-tag { color:#b34b82; text-shadow:none; }
  .dev-tag { background:#f7f5fa; border:1px solid #fff; box-shadow:inset 3px 3px 7px #ded7e3,inset -3px -3px 7px #fff; }
  .login-card input {
    color:var(--ink); background:#f7f5fa; border:0; border-radius:18px;
    box-shadow:inset 5px 5px 10px #ded7e3,inset -5px -5px 10px #fff;
  }
  .login-card input::placeholder { color:#b5a2b2; }
  .login-card input:focus { border:1px solid #ff9ac8; box-shadow:inset 3px 3px 7px #ded7e3,inset -3px -3px 7px #fff,0 0 0 4px #ffe0ee; background:#fffafd; }
  .login-card button {
    color:white; background:linear-gradient(135deg,#ff80ba,#ec368d);
    border:0; border-radius:18px; box-shadow:0 8px 18px #e8a2c5, inset 1px 1px 2px #ffc7e0;
  }
  .login-card button:hover { background:linear-gradient(135deg,#ff91c5,#e82e86); box-shadow:0 11px 22px #e8a2c5; }
  .stats-grid { gap:12px; }
  .stat-box { border-radius:22px; padding:16px 10px; }
  .stat-lbl, .olbl, .shead, .htable th { color:#a96b8d; text-shadow:none; }
  .stat-val { color:var(--pink-deep); text-shadow:0 3px 12px #ffc2dd; }
  .acc-bar-wrap { background:#eee7f0; border:0; box-shadow:inset 2px 2px 5px #d9d1de,inset -2px -2px 5px #fff; }
  .acc-bar-fill { background:linear-gradient(90deg,#ffb5d7,#ec368d); box-shadow:0 0 12px #ffabd1; }
  .tabs { border-radius:20px; padding:5px; gap:4px; }
  .tbtn { color:#9e8298; text-shadow:none; border:0; border-radius:15px; }
  .tbtn.active { color:#fff; background:linear-gradient(135deg,#ff80ba,#e82e86); box-shadow:0 5px 12px #e9a1c3; text-shadow:none; }
  .card { border-radius:28px; padding:22px 16px; min-height:300px; }
  .prd { color:#b04e83; background:#f7f5fa; border:0; box-shadow:inset 3px 3px 7px #ded7e3,inset -3px -3px 7px #fff; text-shadow:none; }
  .mpred, .mpred.small { color:var(--pink-deep); text-shadow:0 0 20px #ffb1d2,0 3px 0 #fff; }
  .obox { border:1px solid #f5c4db; border-radius:20px; box-shadow:inset 4px 4px 8px #e4dce6,inset -4px -4px 8px #fff; }
  .oval { color:#e82e86; text-shadow:0 0 15px #ffc4df; }
  .slist::-webkit-scrollbar-track { background:#eee7f0; }
  .slist::-webkit-scrollbar-thumb { background:#f17db3; box-shadow:none; }
  .scard { border-radius:16px; box-shadow:4px 4px 9px #e1d9e4,-4px -4px 9px #fff; }
  .scard span { text-shadow:none !important; }
  .bwin,.bjack,.bloss { box-shadow:none; text-shadow:none; animation:none; }
  .bwin { color:#16896c; background:#e5f8f0; border:1px solid #a5e3cb; }
  .bjack { color:#d62d80; background:#ffe4f1; border:1px solid #ffacd0; }
  .bloss { color:#b05a73; background:#fff0f3; border:1px solid #f3c0cd; }
  .htable th { border-bottom:1px solid #f0c6dc; }
  .htable td { color:#685568; border-bottom:1px solid #f0e4ed; text-shadow:none; }
  .swin,.sjack,.sloss { text-shadow:none; }
  .swin { color:#16896c; } .sjack { color:#e82e86; } .sloss { color:#c75d7c; }
  .bbtn { color:#d92e83; background:#f7f5fa; border:0; box-shadow:7px 7px 15px #ded7e3,-7px -7px 15px #fff; text-shadow:none; }
  .bbtn:hover { box-shadow:inset 4px 4px 8px #ded7e3,inset -4px -4px 8px #fff; border:0; }
  .modal { background:rgba(247,239,246,.65); }
  .mbox { color:#d92e83; border:1px solid #ff9ac8; box-shadow:9px 9px 22px #d9d3df,-9px -9px 22px #fff; }
  .mwin,.mjack { background:#fff5fa; border-color:#ff9ac8; box-shadow:0 0 0 6px #ffe5f1,9px 9px 22px #d9d3df,-9px -9px 22px #fff; animation:none; }
  .mtitle,.msub { text-shadow:none; }

  /* Half-ring result dial with rotating matrix ticks */
  .result-ring-shell {
    position:relative; width:190px; height:150px; margin:2px auto 12px;
    display:flex; align-items:center; justify-content:center; isolation:isolate;
  }
  .result-ring {
    position:absolute; width:146px; height:146px; border-radius:50%;
    -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);
    -webkit-mask-composite:xor; mask-composite:exclude; padding:5px;
    pointer-events:none;
  }
  .ring-a {
    background:conic-gradient(from 180deg,transparent 0deg,transparent 28deg,#ffb9d8 40deg,#ff4fa3 125deg,#e82e86 170deg,transparent 181deg,transparent 360deg);
    animation:ringSpin 3.2s linear infinite;
  }
  .ring-b {
    width:126px;height:126px;padding:3px;
    background:conic-gradient(from 0deg,transparent 0deg,#ffd5e8 45deg,#ff4fa3 105deg,transparent 180deg,transparent 245deg,#ffabd1 300deg,transparent 360deg);
    animation:ringSpinReverse 5.5s linear infinite;
    opacity:.9;
  }
  .ring-matrix {
    position:absolute; inset:9px; border-radius:50%;
    background:repeating-conic-gradient(from 0deg,rgba(232,46,134,.55) 0deg 1deg,transparent 1deg 12deg);
    -webkit-mask:radial-gradient(circle,transparent 55%,#000 56% 60%,transparent 61%);
    mask:radial-gradient(circle,transparent 55%,#000 56% 60%,transparent 61%);
    animation:ringSpin 18s linear infinite;
    opacity:.42;
  }
  .result-ring-shell::before {
    content:""; position:absolute; width:112px;height:112px;border-radius:50%;
    background:#f7f5fa; box-shadow:inset 5px 5px 10px #ded7e3,inset -5px -5px 10px #fff;
  }
  .result-ring-shell .mpred { position:relative; z-index:2; margin:0; font-size:55px; }
  @keyframes ringSpin { to { transform:rotate(360deg); } }
  @keyframes ringSpinReverse { to { transform:rotate(-360deg); } }
  @keyframes pinkPop { 0%{transform:scale(.86);opacity:.4} 65%{transform:scale(1.06)} 100%{transform:scale(1);opacity:1} }
  .result-ring-shell.result-update { animation:pinkPop .55s ease-out; }
  @media(max-width:360px) { .title{font-size:24px}.result-ring-shell{transform:scale(.92);margin-top:-3px;margin-bottom:4px}.card{padding:18px 12px} }
  @media(prefers-reduced-motion:reduce) { .ring-a,.ring-b,.ring-matrix{animation:none} }

  </style>
</head>
<body>

<!-- VIDEO BACKGROUND -->
<video id="bg-video" autoplay muted loop playsinline>
  <source src="https://videotourl.com/videos/1788492498540-257ffe02-d08b-41be-a805-dd3e55f45f4f.mp4" type="video/mp4">
</video>

<!-- Pink rotating matrix canvas -->
<canvas id="matrix-canvas" aria-hidden="true"></canvas>
<canvas id="fire-canvas"></canvas>

<!-- DARK OVERLAY -->
<div class="overlay"></div>

<!-- POPUP MODAL -->
<div id="popup" class="modal">
  <div id="mbox" class="mbox mwin">
    <div id="mtitle" class="mtitle">🎉 WIN!</div>
    <div id="msub" class="msub">MATCHED TARGET</div>
  </div>
</div>

<!-- LOGIN MODAL -->
<div id="loginModal" class="login-modal">
  <div class="login-card">
    <h1>3 LEVEL SCRIPT</h1>
    <div class="dev">ANSH BHAI</div>
    <input type="text" id="loginInput" placeholder="ENTER KEY" autocomplete="off" spellcheck="false" maxlength="12">
    <button id="loginBtn">UNLOCK</button>
  </div>
</div>

<!-- MAIN APP -->
<div class="app" id="mainApp" style="display: none;">
  <!-- Header -->
  <div class="title">3 LEVEL SCRIPT</div>
  <div class="sub">PREMIUM AI ENGINE</div>
  <div class="dev-tag">DEVELOPED BY ANSH BHAI</div>

  <!-- Stats Dashboard -->
  <div class="stats-grid">
    <div class="stat-box">
      <div class="stat-lbl">WIN RATE</div>
      <div class="stat-val" id="accVal">0.0%</div>
      <div class="acc-bar-wrap">
        <div class="acc-bar-fill" id="accBar"></div>
      </div>
    </div>
    <div class="stat-box">
      <div class="stat-lbl">WIN STREAK</div>
      <div class="stat-val" id="streakVal">🔥 0</div>
    </div>
  </div>

  <!-- Tabs -->
  <div class="tabs">
    <button class="tbtn active" id="b1" onclick="tab('pred')">🛡 PREDICT</button>
    <button class="tbtn" id="b2" onclick="tab('sum')">🕒 W/L LOGS</button>
    <button class="tbtn" id="b3" onclick="tab('hist')">📊 HISTORY</button>
  </div>

  <!-- Main Card -->
  <div class="card">
    <!-- Prediction Panel -->
    <div id="vPred" class="panel active">
      <div style="display:flex;flex-direction:column;align-items:center;width:100%">
        <div id="pText" class="prd">PERIOD: ----------</div>
        <div class="result-ring-shell" aria-label="Animated result ring">
          <div class="result-ring ring-a"></div>
          <div class="result-ring ring-b"></div>
          <div class="ring-matrix" aria-hidden="true"></div>
          <div id="mPred" class="mpred">---</div>
        </div>
        <div class="obox">
          <div class="olbl">RECOMMENDED TARGETS</div>
          <div id="oNum" class="oval">-- / --</div>
        </div>
      </div>
    </div>

    <!-- Summary Logs -->
    <div id="vSum" class="panel">
      <div class="shead" id="sHead">0 PLAYED • 0 WINS • 0 LOSS • 0 🎰</div>
      <div class="slist" id="sList"></div>
    </div>

    <!-- History Table -->
    <div id="vHist" class="panel">
      <table class="htable">
        <thead>
          <tr><th>PERIOD</th><th>PRED</th><th>RESULT</th><th>STATUS</th></tr>
        </thead>
        <tbody id="tLogs">
          <tr><td colspan="4" style="color:#a16207;padding:15px;">SCANNING API...</td></tr>
        </tbody>
      </table>
    </div>
  </div>

  <!-- Footer Brand -->
  <button class="bbtn">꧁𓊈𒆜3 LEVEL SCRIPT 𒆜𓊉꧂</button>
</div>

<script>
  // ==================== LOGIN ====================
  (function() {
    const loginModal = document.getElementById('loginModal');
    const loginInput = document.getElementById('loginInput');
    const loginBtn = document.getElementById('loginBtn');
    const mainApp = document.getElementById('mainApp');

    function checkLogin() {
      const key = loginInput.value.trim().toUpperCase();
      if (key === 'REAL') {
        loginModal.classList.add('hidden');
        mainApp.style.display = 'flex';
        // Start fire + run after login
        setTimeout(() => {
          initMatrix();
          run();
        }, 200);
      } else {
        loginInput.style.borderColor = '#ef4444';
        loginInput.style.boxShadow = '0 0 28px #ef4444, 0 0 0 4px rgba(239,68,68,0.2)';
        setTimeout(() => {
          loginInput.style.borderColor = 'rgba(255, 200, 70, 0.35)';
          loginInput.style.boxShadow = 'none';
        }, 600);
        loginInput.value = '';
        loginInput.placeholder = 'WRONG KEY';
      }
    }

    loginBtn.addEventListener('click', checkLogin);
    loginInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') checkLogin();
    });

    // Allow auto login for demo if needed? no, keep secure.
  })();


  // Lightweight pink matrix rain: mobile-friendly and independent of app logic.
  let matrixStarted = false;
  function initMatrix() {
    if (matrixStarted) return;
    matrixStarted = true;
    const canvas = document.getElementById('matrix-canvas');
    if (!canvas) return;
    const ctx = canvas.getContext('2d');
    let w = 0, h = 0, cols = 0, drops = [];
    const chars = '01◇○✦＋';
    function resize() {
      const dpr = Math.min(window.devicePixelRatio || 1, 1.5);
      w = window.innerWidth; h = window.innerHeight;
      canvas.width = Math.floor(w*dpr); canvas.height = Math.floor(h*dpr);
      canvas.style.width = w+'px'; canvas.style.height = h+'px';
      ctx.setTransform(dpr,0,0,dpr,0,0);
      cols = Math.ceil(w/22);
      drops = Array.from({length:cols},()=>Math.random()*-30);
    }
    resize();
    window.addEventListener('resize', resize, {passive:true});
    let last = 0;
    function draw(t) {
      requestAnimationFrame(draw);
      if (t-last < 65) return;
      last=t;
      ctx.clearRect(0,0,w,h);
      ctx.font='12px monospace';
      for(let i=0;i<drops.length;i++){
        const y=drops[i]*22;
        ctx.fillStyle = Math.random()>.82 ? 'rgba(232,46,134,.65)' : 'rgba(255,79,163,.35)';
        ctx.fillText(chars[Math.floor(Math.random()*chars.length)],i*22,y);
        drops[i] += .35 + Math.random()*.45;
        if(y>h && Math.random()>.975) drops[i]=Math.random()*-8;
      }
    }
    requestAnimationFrame(draw);
  }

  // ==================== FIRE ANIMATION ====================
  function initFire() {
    const canvas = document.getElementById('fire-canvas');
    const ctx = canvas.getContext('2d');
    let width, height;

    function resize() {
      width = canvas.width = window.innerWidth;
      height = canvas.height = window.innerHeight * 0.3;
    }
    resize();
    window.addEventListener('resize', resize);

    const particles = [];
    const PARTICLE_COUNT = 90;
    const MAX_LIFE = 100;

    class FireParticle {
      constructor() {
        this.reset();
      }
      reset() {
        this.x = Math.random() * width;
        this.y = height + Math.random() * 20;
        this.size = Math.random() * 40 + 18;
        this.speedY = Math.random() * 2.8 + 1.2;
        this.speedX = (Math.random() - 0.5) * 1.2;
        this.life = MAX_LIFE;
        this.hue = Math.random() * 30 + 10; // orange-red
        this.alpha = 0.85;
      }
      update() {
        this.y -= this.speedY;
        this.x += this.speedX + Math.sin(this.y * 0.02) * 0.6;
        this.life -= 1.2;
        this.alpha = Math.max(0, this.life / MAX_LIFE);
        if (this.life <= 0 || this.y < -30) {
          this.reset();
        }
      }
      draw() {
        const gradient = ctx.createRadialGradient(this.x, this.y, 0, this.x, this.y, this.size);
        gradient.addColorStop(0, `hsla(${this.hue}, 100%, 65%, ${this.alpha})`);
        gradient.addColorStop(0.5, `hsla(${this.hue + 10}, 100%, 50%, ${this.alpha * 0.7})`);
        gradient.addColorStop(1, `hsla(${this.hue + 20}, 100%, 35%, 0)`);
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
        ctx.fillStyle = gradient;
        ctx.fill();
      }
    }

    for (let i = 0; i < PARTICLE_COUNT; i++) {
      particles.push(new FireParticle());
    }

    function animate() {
      ctx.clearRect(0, 0, width, height);
      // slight additive blend for fire
      ctx.globalCompositeOperation = 'lighter';
      for (let p of particles) {
        p.update();
        p.draw();
      }
      ctx.globalCompositeOperation = 'source-over';
      requestAnimationFrame(animate);
    }
    animate();
  }

  // ==================== APP LOGIC (with glass premium) ====================
  let fallback = false;
  let state = {
    last: null,
    count: 0,
    pred: null,
    pNum: null,
    oNum: null,
    total: 0,
    wins: 0,
    jack: 0,
    loss: 0,
    streak: 0
  };

  function tab(t) {
    ['pred', 'sum', 'hist'].forEach((k, i) => {
      document.getElementById('v' + k.charAt(0).toUpperCase() + k.slice(1)).classList.toggle('active', k === t);
      document.getElementById('b' + (i + 1)).classList.toggle('active', k === t);
    });
  }

  function popup(type, num) {
    let box = document.getElementById('mbox'), m = document.getElementById('popup');
    if (type === "JACKPOT") {
      box.className = "mbox mjack";
      document.getElementById('mtitle').innerText = "🎰 JACKPOT WIN!";
      document.getElementById('msub').innerText = "EXACT NUMBER MATCH: " + num;
    } else {
      box.className = "mbox mwin";
      document.getElementById('mtitle').innerText = "🎉 WIN!";
      document.getElementById('msub').innerText = "RESULT NUMBER: " + num;
    }
    m.classList.add('active');
    setTimeout(() => m.classList.remove('active'), 2400);
  }

  function getCat(n) { return (n >= 0 && n <= 4) ? "SMALL" : "BIG"; }

  function getRand() {
    let p = Math.floor(Math.random() * 10);
    let c = getCat(p);
    let o = (c === "BIG") ? Math.floor(Math.random() * 5) : Math.floor(Math.random() * 5) + 5;
    return { pNum: p, pred: c, oNum: o };
  }

  async function fetchAPI() {
    let url = fallback ? 'https://api.allorigins.win/raw?url=' + encodeURIComponent('https://draw.ar-lottery01.com/WinGo/WinGo_1M/GetHistoryIssuePage.json') : 'https://draw.ar-lottery01.com/WinGo/WinGo_1M/GetHistoryIssuePage.json';
    try {
      let res = await fetch(url);
      if (!res.ok) throw '';
      return await res.json();
    } catch (e) {
      fallback = true;
      return null;
    }
  }

  function proc(item) {
    if (state.last === item.issueNumber) return false;

    if (state.pred) {
      let actNum = parseInt(item.number);
      let actCat = getCat(actNum);
      let isJack = (actNum === state.pNum);
      let isWin = isJack || (state.pred === actCat) || (actNum === state.oNum);

      state.total++;
      let bCls = "bloss", sTxt = "LOSS";

      if (isJack) {
        bCls = "bjack";
        sTxt = "🎰 JACKPOT";
        state.jack++;
        state.wins++;
        state.streak++;
        popup("JACKPOT", actNum);
      } else if (isWin) {
        bCls = "bwin";
        sTxt = "WIN";
        state.wins++;
        state.streak++;
        popup("WIN", actNum);
      } else {
        state.loss++;
        state.streak = 0;
      }

      /* Update Statistics Panel */
      let accRate = state.total > 0 ? ((state.wins / state.total) * 100).toFixed(1) : 0;
      document.getElementById('accVal').innerText = accRate + "%";
      document.getElementById('accBar').style.width = accRate + "%";
      document.getElementById('streakVal').innerText = "🔥 " + state.streak;

      let sList = document.getElementById('sList');
      sList.insertAdjacentHTML('afterbegin',
        `<div class="scard">
          <div>
            <span style="font-size:11px;font-weight:800;color:#fde68a">${item.issueNumber}</span><br>
            <span style="font-size:9px;color:#d4a373">TARGETS: ${state.pNum} / ${state.oNum}</span>
          </div>
          <div style="display:flex;align-items:center;gap:6px;">
            <span style="font-size:15px;font-weight:900;color:#fde68a">${actNum}</span>
            <span class="${bCls}">${sTxt}</span>
          </div>
        </div>`
      );
      if (sList.children.length > 25) sList.removeChild(sList.lastChild);

      document.getElementById('sHead').innerText = `${state.total} PLAYED • ${state.wins} WINS • ${state.loss} LOSS • ${state.jack} 🎰`;

      let tBody = document.getElementById('tLogs');
      if (state.count === 1) tBody.innerHTML = "";
      let row = tBody.insertRow(0);
      row.innerHTML = `<td>${item.issueNumber.slice(-4)}</td><td>${state.pred}</td><td>${item.number}</td><td><span class="${isJack ? 'sjack' : (isWin ? 'swin' : 'sloss')}">${sTxt}</span></td>`;
      if (tBody.children.length > 25) tBody.removeChild(tBody.lastChild);
    }

    let nxt = getRand();
    state.pred = nxt.pred;
    state.pNum = nxt.pNum;
    state.oNum = nxt.oNum;
    state.last = item.issueNumber;
    state.count++;
    return true;
  }

  async function run() {
    setInterval(async () => {
      let data = await fetchAPI();
      if (data && data.data && data.data.list && data.data.list.length > 0) {
        let item = data.data.list[0];
        if (proc(item)) {
          try {
            let nextPrd = (BigInt(item.issueNumber) + 1n).toString();
            document.getElementById('pText').innerText = "PERIOD: " + nextPrd;
          } catch (e) {}
          let ringShell = document.querySelector('.result-ring-shell');
          if (ringShell) {
            ringShell.classList.remove('result-update');
            void ringShell.offsetWidth;
            ringShell.classList.add('result-update');
          }
          let m = document.getElementById('mPred');
          m.innerText = state.pred;
          m.className = state.pred === "BIG" ? "mpred" : "mpred small";
          document.getElementById('oNum').innerText = state.pNum + " / " + state.oNum;
        }
      }
    }, 3000);
  }

  // Expose tab globally
  window.tab = tab;
</script>
</body>
</html>
